dataset:
  name: celeba256
  root: /content/drive/MyDrive/RAMA/celeba_hq_256/celeba_hq_256
  image_size: 256

latents:
  output_dir: /content/drive/MyDrive/RAMA/latents_256/data/latents

vae:
  checkpoint_id: stabilityai/sd-vae-ft-mse
  local_checkpoint: checkpoints/sd-vae-ft-mse
  cache_dir: .cache/huggingface
  dtype: fp16
  device: cuda

micro_latent:
  residual_shape: [4, 32, 32]
  patch_size: 4
  # patch_dim auto-derived: C * patch_size^2

output:
  dir: /content/drive/MyDrive/RAMA/outputs/

rama_bases:
  seed: 1234
  # cache_path auto-derived: cache/rama_bases_p{num_patches}_d{patch_dim}.pt

tokenizer:
  config_path: cache/rama_tokenizer_config.pt
  num_bins: 256
  bound: 4.0
  bound_method: percentile_abs_y
  percentile: 99.5

context_encoder:
  architecture: vit
  in_channels: 4
  context_dim: 256
  vit_layers: 6
  vit_heads: 8
  vit_mlp_ratio: 4
  dropout: 0.01
  positional_embedding: true
  context_noise_sigma: 2
  # grid_size auto-derived from patch_size and residual_shape

micro:
  type: categorical
  architecture: mlp
  context_dim: 256
  # patch_dim auto-derived
  hidden_dim: 512
  num_layers: 4
  dim_emb_dim: 64
  dropout: 0.05
  num_bins: 256
  loss: cross_entropy

micro_continuous:
  type: nflows
  enabled: false
  context_dim: 256
  # patch_dim auto-derived
  dim_emb_dim: 64
  hidden_dim: 512
  num_layers: 4
  spline_bins: 16
  tail_bound: 3.0
  loss: negative_log_likelihood

training:
  batch_size_per_gpu: 128
  num_gpus: 1
  gradient_accumulation_steps: 1
  optimizer: AdamW
  learning_rate: 5e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4
  precision: bf16
  total_steps: 200000
  warmup_steps: 2000  # 5% of total_steps; default is total_steps // 20
  grad_clip: 1.0
  val_split: 0.05  # fraction of dataset held out for validation

logging:
  tracker: wandb
  project: rama
  entity: null
  run_name: celeba256-sdvae-high-rama
  log_every_steps: 100
  val_every_steps: 500  # evaluate val loss every N steps to monitor overfitting
  checkpoint_every_steps: 5000
  sample_every_steps: 1000
  num_sample_images: 8

evaluation:
  fid_every_steps: 5000
  fid_num_samples: 5000
  fid_batch_size: 32
  fid_stats: /content/drive/MyDrive/RAMA/fid_stats_celeba256_5k.pt
  temperature: 1.0
  use_argmax: false
